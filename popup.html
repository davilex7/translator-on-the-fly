<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Manhwa</title>
    <link href="css/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            width: 280px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 32px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4B5563;
            transition: .4s;
            border-radius: 9999px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2563EB;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        input:disabled + .slider {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }
        .api-key-input {
            font-size: 11px;
            letter-spacing: -0.5px;
        }
        .api-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .api-status.configured {
            background-color: #10B981;
        }
        .api-status.not-configured {
            background-color: #EF4444;
        }
    </style>
</head>
<body class="p-4 bg-gray-100">
    <div class="flex flex-col items-center space-y-3">
        <h1 class="text-lg font-semibold text-gray-800">Traductor de Manhwa</h1>
        <img src="icons/icon48.png"
             alt="Icono"
             class="w-10 h-10 rounded-md object-cover"
             onerror="this.style.display='none'">

        <div class="w-full bg-white rounded-lg p-3 shadow-sm">
            <label for="api-key" class="block text-xs font-medium text-gray-700 mb-1">
                <span id="api-status-indicator" class="api-status not-configured"></span>
                Google Vision API Key
            </label>
            <div class="flex space-x-2">
                <input type="password"
                       id="api-key"
                       placeholder="AIza..."
                       class="api-key-input flex-1 px-2 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                <button id="save-api-key"
                        class="px-2 py-1 bg-blue-600 text-white text-xs rounded hover:bg-blue-700 focus:outline-none">
                    Guardar
                </button>
            </div>
            <p id="api-key-status" class="text-xs text-gray-500 mt-1"></p>
        </div>

        <div class="w-full">
            <label for="language-select" class="block text-xs font-medium text-gray-700 mb-1">Traducir a:</label>
            <select id="language-select" class="w-full px-2 py-1.5 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="es">Espanol</option>
                <option value="en">English</option>
                <option value="fr">Francais</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Portugues</option>
                <option value="ja">Japanese</option>
            </select>
        </div>

        <div class="w-full flex items-center justify-between bg-white rounded-lg p-3 shadow-sm">
            <span class="text-sm text-gray-700 font-medium">Activar traduccion</span>
            <label class="switch">
                <input type="checkbox" id="toggle" disabled>
                <span class="slider"></span>
            </label>
        </div>

        <p id="status" class="text-xs text-gray-500">Configura tu API Key para comenzar</p>

        <div id="progress-section" class="w-full hidden">
            <p id="progress-status" class="text-xs text-center text-gray-600 mb-1">Procesando...</p>
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="stats-section" class="w-full text-xs text-gray-500 hidden">
            <div class="flex justify-between">
                <span>Imagenes procesadas:</span>
                <span id="stats-images">0</span>
            </div>
            <div class="flex justify-between">
                <span>Bloques de texto:</span>
                <span id="stats-blocks">0</span>
            </div>
        </div>
    </div>

    <script src="js/popup.js"></script>
</body>
</html>
