<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor de Imagenes</title>
    <link href="css/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            width: 280px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 32px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4B5563;
            transition: .4s;
            border-radius: 9999px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2563EB;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        input:disabled + .slider {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online {
            background-color: #10B981;
            box-shadow: 0 0 6px #10B981;
        }
        .status-dot.offline {
            background-color: #EF4444;
        }
        .status-dot.checking {
            background-color: #F59E0B;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="p-4 bg-gray-100">
    <div class="flex flex-col items-center space-y-3">
        <h1 class="text-lg font-semibold text-gray-800">Traductor de Imagenes</h1>
        <img src="icons/icon48.png"
             alt="Icono"
             class="w-10 h-10 rounded-md object-cover"
             onerror="this.style.display='none'">

        <!-- Estado del servidor -->
        <div class="w-full bg-white rounded-lg p-3 shadow-sm">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-gray-700">
                    <span id="server-status-dot" class="status-dot checking"></span>
                    Servidor OCR
                </span>
                <button id="check-server-btn" class="text-xs text-blue-600 hover:text-blue-800">
                    Verificar
                </button>
            </div>
            <p id="server-status-text" class="text-xs text-gray-500">Verificando conexion...</p>

            <!-- URL del servidor (colapsable) -->
            <details class="mt-2">
                <summary class="text-xs text-gray-500 cursor-pointer hover:text-gray-700">Configurar URL</summary>
                <div class="mt-2 flex space-x-1">
                    <input type="text"
                           id="server-url"
                           value="http://localhost:5000"
                           class="flex-1 px-2 py-1 text-xs border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <button id="save-url-btn"
                            class="px-2 py-1 bg-gray-600 text-white text-xs rounded hover:bg-gray-700">
                        OK
                    </button>
                </div>
            </details>
        </div>

        <!-- Selector de idioma origen -->
        <div class="w-full">
            <label for="source-language-select" class="block text-xs font-medium text-gray-700 mb-1">Idioma de origen:</label>
            <select id="source-language-select" class="w-full px-2 py-1.5 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="ko">Coreano</option>
                <option value="ja">Japones</option>
                <option value="en">Ingles</option>
                <option value="es">Espanol</option>
            </select>
        </div>

        <!-- Selector de idioma destino -->
        <div class="w-full">
            <label for="language-select" class="block text-xs font-medium text-gray-700 mb-1">Traducir a:</label>
            <select id="language-select" class="w-full px-2 py-1.5 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="es">Espanol</option>
                <option value="en">Ingles</option>
            </select>
        </div>

        <!-- Toggle de traduccion -->
        <div class="w-full flex items-center justify-between bg-white rounded-lg p-3 shadow-sm">
            <span class="text-sm text-gray-700 font-medium">Activar traduccion</span>
            <label class="switch">
                <input type="checkbox" id="toggle" disabled>
                <span class="slider"></span>
            </label>
        </div>

        <p id="status" class="text-xs text-gray-500">Inicia el servidor para comenzar</p>

        <!-- Barra de progreso -->
        <div id="progress-section" class="w-full hidden">
            <p id="progress-status" class="text-xs text-center text-gray-600 mb-1">Procesando...</p>
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Estadisticas -->
        <div id="stats-section" class="w-full text-xs text-gray-500 hidden">
            <div class="flex justify-between">
                <span>Imagenes procesadas:</span>
                <span id="stats-images">0</span>
            </div>
            <div class="flex justify-between">
                <span>Bloques de texto:</span>
                <span id="stats-blocks">0</span>
            </div>
        </div>

        <!-- Ayuda -->
        <div class="w-full pt-2 border-t border-gray-200">
            <p class="text-xs text-gray-400 text-center">
                Ejecuta <code class="bg-gray-200 px-1 rounded">start_server.bat</code> en la carpeta server/
            </p>
        </div>
    </div>

    <script src="js/popup.js"></script>
</body>
</html>
