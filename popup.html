<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Manga</title>
    <link href="css/tailwind.min.css" rel="stylesheet">
    <style>
        /* Estilo básico para el cuerpo del popup */
        body {
            width: 250px;
            font-family: 'Inter', sans-serif; /* Fuente limpia */
        }
        /* Asegura que la fuente Inter se cargue (si usas fuentes de Google Fonts, necesitarías ajustar CSP o descargarlas también) */
        /* @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap'); */
        /* Por simplicidad, eliminamos la fuente externa por ahora */

        /* Estilos para el switch (igual que antes) */
        .switch {
            position: relative;
            display: inline-block;
            width: 56px; /* w-14 */
            height: 32px; /* h-8 */
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4B5563; /* bg-gray-600 */
            transition: .4s;
            border-radius: 9999px; /* rounded-full */
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 24px; /* h-6 */
            width: 24px; /* w-6 */
            left: 4px; /* left-1 */
            bottom: 4px; /* top-1 (ajustado por bottom) */
            background-color: white;
            transition: .4s;
            border-radius: 50%; /* rounded-full */
        }
        input:checked + .slider {
            background-color: #2563EB; /* bg-blue-600 */
        }
        input:checked + .slider:before {
            transform: translateX(24px); /* Mueve el círculo */
        }
    </style>
</head>
<body class="p-4 bg-gray-100">
    <div class="flex flex-col items-center space-y-4">
        <h1 class="text-lg font-semibold text-gray-800">Traductor de Manga</h1>
        <img src="icons/icon48.png"
             alt="Icono de la extensión"
             class="w-12 h-12 rounded-md object-cover"
             onerror="this.onerror=null; this.src='https://placehold.co/48x48/cccccc/ffffff?text=Icon';">

        <label class="switch flex items-center cursor-pointer">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
             <span class="ml-3 text-gray-700 font-medium pl-16">
                Activar Traducción
            </span>
        </label>

        <p id="status" class="text-sm text-gray-500 mt-2">Estado: Desactivado</p>

        <div class="w-full pt-4">
            <label for="language-select" class="block text-sm font-medium text-gray-700 mb-1">Traducir a:</label>
            <select id="language-select" name="language" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                <option value="es">Español (Spanish)</option>
                <option value="en">Inglés (English)</option>
                <option value="fr">Francés (French)</option>
                <option value="de">Alemán (German)</option>
                <option value="it">Italiano (Italian)</option>
                <option value="pt">Portugués (Portuguese)</option>
                 <option value="ja">Japonés (Japanese)</option>
            </select>
        </div>
         <div id="progress-section" class="w-full pt-4 hidden">
            <p id="progress-status" class="text-sm text-center text-gray-600 mb-1">Procesando...</p>
            <div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script src="js/popup.js"></script> </body>
</html>
